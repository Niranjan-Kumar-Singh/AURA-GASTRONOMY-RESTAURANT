name: AURA Digital Dining CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install Frontend Dependencies
        run: cd frontend && npm ci
      - name: Build React Application
        run: cd frontend && npm run build

  backend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install Backend Dependencies
        run: cd backend && npm ci
      - name: Verify Backend Syntax & Quality
        run: |
          cd backend
          node --check server.js
          node --check seed.js
          node -e "
            const fs = require('fs');
            const { execSync } = require('child_process');
            ['routes', 'models', 'middleware'].forEach(dir => {
              if (fs.existsSync(dir)) {
                fs.readdirSync(dir).filter(f => f.endsWith('.js')).forEach(file => {
                  execSync('node --check ' + dir + '/' + file, { stdio: 'inherit' });
                });
              }
            });
            console.log('All backend JavaScript files passed syntax verification!');
          "
