server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: aura-digital-dining-backend
  
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/restaurant_db}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

security:
  jwt:
    secret: ${JWT_SECRET:401b61e0369fed0476d9f7c5d6f0c72719a86895311e63a15f013}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}             # 15 minutes
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days

app:
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
